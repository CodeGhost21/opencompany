# Issue #590. Every `uses:` below is a full commit SHA with the resolved version
# in a trailing comment — `actions/*` included, no exemptions. The rationale is
# at the top of `ci.yml`. It matters most here: this job holds `contents: write`
# and publishes a release, so an action resolved from a moved tag would run with
# a token that can rewrite what users download. `dtolnay/rust-toolchain` also
# passes an explicit `toolchain:` — under `@stable` the ref made that choice, and
# a SHA does not; see `ci.yml` for the whole argument.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.1.0
        required: true
        type: string
      notes_from:
        description:
          Start of the release-notes range, EXCLUDED. `latest-release` resolves
          the previous GitHub Release, and falls back to the repository's root
          commit when there is none — pass an explicit tag or SHA to bound a
          first release.
        required: false
        default: latest-release
        type: string
      notes_ai:
        description:
          Polish the generated notes with OpenAI. Requires OPENAI_API_KEY; the
          run falls back to the deterministic renderer rather than failing.
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`. The release-notes generator walks
      # `<previous release>..<tag>` and reads EVERY author before the range to
      # tell a first-time contributor from a returning one. Under the default
      # shallow checkout that history is not present, `git log A..B` prints
      # nothing for an unknown A, and the notes come out empty and green — the
      # one failure mode worth paying a full clone to remove.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      # `openhuman_core` is an optional path dependency, so Cargo must resolve
      # its vendored-crate manifests even for the default build. `submodules:
      # true` is not recursive, hence the explicit init.
      #
      # BEHAVIOUR CHANGE, issue #592. This job's own copy of the init had
      # drifted from the five in `ci.yml`: it fetched five submodules, omitting
      # `vendor/tinyhumans-sdk`, and skipped the nested `tinycortex` init
      # entirely. `tinyhumans-sdk` is an unconditional path dependency of the
      # vendored openhuman crate (issue #499), so the `cargo build --locked`
      # below could not have resolved the workspace manifest — it fails with
      # "failed to read vendor/openhuman/vendor/tinyhumans-sdk/Cargo.toml"
      # before compiling anything. That went unnoticed only because this
      # workflow is `workflow_dispatch`-only and had never run; the next
      # dispatch would have failed. The stale comment here still cited the
      # `[patch]` entries as the rationale, which is what the missed sweep
      # looked like.
      #
      # Calling the shared script both fixes that and makes the drift
      # impossible to reintroduce. The script derives the crate list from the
      # pinned `vendor/openhuman/.gitmodules`, so no workflow — and not the
      # script either — holds a copy that a resync can invalidate.
      - name: Init vendored openhuman crate submodules
        run: scripts/ci/init-vendored-submodules.sh

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.0"

      # `--locked` for the same reason issue #251 requires it throughout
      # `ci.yml`: both commands resolve a dependency graph, and without the flag
      # this job can build and test a graph that differs from the committed
      # `Cargo.lock`. That matters more here than in CI, not less — this is the
      # tree that becomes a release artifact, so a silent re-resolution ships.
      - name: Verify
        run: |
          cargo build --locked --all-targets
          cargo test --locked

      # ---- Release notes ------------------------------------------------------
      # `generate_release_notes: true` used to do this, and what it produced was
      # a flat "* <title> by @who in <url>" list in merge order. The generator
      # below groups the same PRs into themed highlights and, unlike anything
      # GitHub derives, names FIRST-TIME contributors — it reads history before
      # the range, which the built-in list never does.
      #
      # Node is needed only for the generator; nothing else in this job uses it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # `continue-on-error` plus the fallback below, not `||` inside one step:
      # a failed OpenAI call must still leave a `release-notes.md` behind, and
      # the two-step form makes WHICH renderer ran visible in the job log rather
      # than hiding a degraded release behind a green step.
      #
      # The 5-minute cap is above the generator's own 300s abort, so a hung API
      # is caught by the script (which then exits non-zero and hands over to the
      # fallback) rather than by the step, which would kill the job outright.
      - name: Generate release notes (AI)
        id: ai-notes
        if: inputs.notes_ai
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAG: ${{ inputs.tag }}
          NOTES_FROM: ${{ inputs.notes_from }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::OPENAI_API_KEY is empty — falling back to deterministic notes."
            exit 1
          fi
          node scripts/release/generate-release-notes.mjs \
            --from "$NOTES_FROM" \
            --to "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --output release-notes.md

      # Runs when AI notes were disabled, skipped, or failed. This one is NOT
      # `continue-on-error`: if the deterministic renderer cannot produce notes
      # either, something is wrong with the range itself and the release should
      # not be cut with an empty body.
      - name: Generate release notes (deterministic)
        if: ${{ !inputs.notes_ai || steps.ai-notes.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES_FROM: ${{ inputs.notes_from }}
        run: |
          set -euo pipefail
          node scripts/release/generate-release-notes.mjs \
            --from "$NOTES_FROM" \
            --to "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --no-ai \
            --output release-notes.md

      # So the notes are readable without opening the Release, and so a bad
      # range is diagnosable from the run that produced it.
      - name: Print notes to job summary
        run: cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          body_path: release-notes.md
          # Anything with a pre-release suffix — `v0.1.0-rc.1`, `-beta.2` — is
          # marked as one, so it does not become the "Latest release" the
          # repository's front page points at and `--from latest-release` picks
          # up next time. A plain `vX.Y.Z` has no hyphen and is a full release.
          prerelease: ${{ contains(inputs.tag, '-') }}
