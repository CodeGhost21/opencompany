# Issue #590. Every `uses:` below is a full commit SHA with the resolved version
# in a trailing comment — `actions/*` included, no exemptions. The rationale is
# at the top of `ci.yml`. It matters most here: this job holds `contents: write`
# and publishes a release, so an action resolved from a moved tag would run with
# a token that can rewrite what users download. `dtolnay/rust-toolchain` also
# passes an explicit `toolchain:` — under `@stable` the ref made that choice, and
# a SHA does not; see `ci.yml` for the whole argument.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # `openhuman_core` is an optional path dependency, so Cargo must resolve
      # its vendored-crate manifests even for the default build. `submodules:
      # true` is not recursive, hence the explicit init.
      #
      # BEHAVIOUR CHANGE, issue #592. This job's own copy of the init had
      # drifted from the five in `ci.yml`: it fetched five submodules, omitting
      # `vendor/tinyhumans-sdk`, and skipped the nested `tinycortex` init
      # entirely. `tinyhumans-sdk` is an unconditional path dependency of the
      # vendored openhuman crate (issue #499), so the `cargo build --locked`
      # below could not have resolved the workspace manifest — it fails with
      # "failed to read vendor/openhuman/vendor/tinyhumans-sdk/Cargo.toml"
      # before compiling anything. That went unnoticed only because this
      # workflow is `workflow_dispatch`-only and had never run; the next
      # dispatch would have failed. The stale comment here still cited the
      # `[patch]` entries as the rationale, which is what the missed sweep
      # looked like.
      #
      # Calling the shared script both fixes that and makes the drift
      # impossible to reintroduce. The script derives the crate list from the
      # pinned `vendor/openhuman/.gitmodules`, so no workflow — and not the
      # script either — holds a copy that a resync can invalidate.
      - name: Init vendored openhuman crate submodules
        run: scripts/ci/init-vendored-submodules.sh

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.0"

      # `--locked` for the same reason issue #251 requires it throughout
      # `ci.yml`: both commands resolve a dependency graph, and without the flag
      # this job can build and test a graph that differs from the committed
      # `Cargo.lock`. That matters more here than in CI, not less — this is the
      # tree that becomes a release artifact, so a silent re-resolution ships.
      - name: Verify
        run: |
          cargo build --locked --all-targets
          cargo test --locked

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
