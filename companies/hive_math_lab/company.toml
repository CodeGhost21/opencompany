# The Agentic Math Lab, re-seated as one hive-mind desk.
#
# `companies/agentic_math_lab` splits the work across four one-member desks and
# an orchestrator that hands it from one to the next. This bundle keeps the same
# three working roles — decide the approach, write the program, break the
# result — but seats them **on one desk**, so an operator's problem is answered
# by a tinyhivemind deliberation episode rather than by a single lead's turn
# (`docs/spec/runtime/hivemind.md`). Nobody dispatches anybody: each member
# bids on the salience of what has been said, the highest bid takes the floor,
# and the desk carries an answer only once a quorum of distinct members has
# grounded support for it.
#
# The acceptance test is the same as the parent lab's: a Project Euler problem
# stated in the desk, and the integer the room converges on checked against the
# published one. `scripts/hive-euler.py` drives that loop headlessly across a
# ladder of problem difficulties.

[company]
name = "Hive Math Lab"
output = "Verified answers to computational problems, decided by a deliberating desk rather than a single solver"
human_role = "State the problem in the solvers desk and accept the answer the room converges on"

[policy]
# See the parent bundle: `full` opens only the agent's own sandbox, and `shell`
# still parks for approval on every tier. A headless driver has to pump the
# approvals queue (`scripts/hive-euler.py` does).
mode = "full"

[users]
admins = ["harness-e2e@tinyhumans.ai"]

[tools]
# No `web`, no `search`: the answer has to be computed, not looked up. See the
# parent bundle for the full argument.
allow = ["files", "docs", "shell", "code", "workspace", "workspace.*"]

# Inference is routed through the local llm-ladder-router so a live run costs
# marketplace rates rather than a hosted subscription. The ladder's model ids
# are tiers of its own (`flash`, `reasoning`, `max-reasoning`); the key comes
# from `OPENCOMPANY_INFERENCE_KEY`. Override the URL with
# `OPENCOMPANY_INFERENCE_URL` when the router lives elsewhere.
[inference]
provider = "openai_compatible"
base_url = "http://127.0.0.1:6969/v1"
models = { "chat-v1" = "flash", "reasoning-v1" = "reasoning", "agentic-v1" = "max-reasoning", "vision-v1" = "flash" }

# ---------------------------------------------------------------------------
# The one desk that matters.
#
# Three members, three different instruments: the theorist reduces, the
# programmer computes, the verifier attacks. A quorum of two means an answer
# carries once a second, differently-equipped member has grounded support for
# it — which is exactly the parent lab's "two independent routes agreed" rule,
# now enforced by the fold rather than by an orchestrator remembering to ask.
# ---------------------------------------------------------------------------

[[group_chat]]
id = "solvers"
name = "Solvers desk"
description = "One problem at a time. Reduce it, program it, try to break the number, and commit only what survived."
members = ["theorist", "programmer", "verifier"]

[group_chat.hive]
enabled = true
# Three members × four turns each. The benchmark's rule of thumb is three per
# member; a solve needs a program run in the middle, so one more each.
turn_budget = 12
quorum = 2
blind_round = true

# The records desk is kept so an accepted answer still has somewhere to be
# written down. One member, so it answers as it always did.
[[group_chat]]
id = "records"
name = "Records desk"
description = "Writing the accepted answer and its method down where the next problem can find them."
members = ["scribe"]

[workflows]
enabled = ["euler_solve"]
