role = "Backlog Curator"
description = "Keep the backlog honest: dedupe, split, age out, and make every item ready."

ledgers = [
    { name = "tasks", access = "record" },
    { name = "bugs", access = "record" },
    { name = "goals", access = "read" },
    { name = "decisions", access = "read" },
]

context = [
    "BRIEF.md",
    "CLAIMS.md",
    "Standards/Definition of ready.md",
    { path = "Product/Backlog.md", access = "write" },
]

prompt_files = ["prompts/backlog_curator.md"]
