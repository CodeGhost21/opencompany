[workspace]
resolver = "3"

[package]
name = "opencompany-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opencompany = { path = "../.." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread"] }
